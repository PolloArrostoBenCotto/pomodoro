<!doctype html>

<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Pomodoro timer" />
        <title>Pomodoro</title>
        <link rel="icon" type="image/png" href="/static/icons/pollorfolio.png">
        <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}" />
    </head>
    <body>
        <main id="top">
            <div class="container hero">
                <h1>25:00</h1>
                <a class="prog"></a>
                <div class="controls">
                    <a class="button" onclick="StartPomoLong()">Start</a>
                    <a class="button" onclick="PausePomoLong()">Pause</a>
                    <a class="button" onclick="RestartPomoLong()" id="restart">Restart</a>
                </div>
            </div>

        <footer class="container">© 2026 Pollo</footer>
    </body>
</html>

<script>
    let mins = 25;
    let secs = 0;
    let timer;
    let longfinish = 1;
    document.getElementById("restart").style.visibility="hidden";
        document.getElementById("restart").style.display="none";

    function StartPomoLong() {
        clearInterval(timer);
        timer = setInterval(updateTimer, 1000);
    }

    function PausePomoLong() {
        clearInterval(timer);
    }

    function RestartPomoLong() {
        clearInterval(timer);
        mins = 25;
        secs = 0;
        document.querySelector('h1').textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        document.getElementById("restart").style.visibility="hidden";
        document.getElementById("restart").style.display="none";
    }

    function updateTimer() {
        if (secs === 0) {
            if (mins === 0) {
                clearInterval(timer);
                longfinish++;
                return;
            }
            mins--;
            secs = 59;
        } else {
            secs--;
        }
        document.querySelector('h1').textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        if (mins !== 25) {
            document.getElementById("restart").style.visibility="visible";
            document.getElementById("restart").style.display="inherit";
        }
    }
    for (let i = 0; i < longfinish; i++) {
        document.querySelector('.prog').innerHTML += '&#9670;';
    }
    for (let i = 0; i < (4-longfinish); i++) {
        document.querySelector('.prog').innerHTML += '&#9671;';
    }

</script>
