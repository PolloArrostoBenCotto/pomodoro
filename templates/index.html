<!doctype html>

<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Pomodoro timer" />
        <title>Pomodoro</title>
        <link rel="icon" type="image/png" href="/static/icons/pollorfolio.png">
        <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}" />
    </head>
    <body>
        <main id="top">
            <div class="container hero">
                <h1>25:00</h1>
                <div class="controls">
                    <a class="button" onclick="StartPomoLong()">Start</a>
                    <a class="button" onclick="PausePomoLong()">Pause</a>
                </div>
            </div>

        <footer class="container">© 2026 Pollo</footer>
    </body>
</html>

<script>
    let mins = 25;
    let secs = 0;
    let timer;

    function StartPomoLong() {
        clearInterval(timer);
        timer = setInterval(updateTimer, 1000);
    }

    function PausePomoLong() {
        clearInterval(timer);
    }

    function updateTimer() {
        if (secs === 0) {
            if (mins === 0) {
                clearInterval(timer);
                alert("Time's up!");
                return;
            }
            mins--;
            secs = 59;
        } else {
            secs--;
        }
        document.querySelector('h1').textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }
</script>
